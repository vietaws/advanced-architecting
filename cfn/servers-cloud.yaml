AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Hybrid DNS Demo - VPC A Cloud App Server
  Deploys one EC2 instance in VPC A public subnet 1a (10.1.0.0/24):
    - EC2-Cloud  (10.1.0.40)  Node.js app server, public internet access
  Uses Amazon Linux 2023 ARM64 on t4g.micro with SSM access.
  Depends on: hybrid-dns-demo-network stack (cfn-network.yaml)

Parameters:
  EnvironmentName:
    Type: String
    Default: hybrid-dns-demo
    Description: Must match the EnvironmentName used in the network stack.

  LatestAL2023AmiArm64:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 ARM64 - resolved automatically via SSM.

# =============================================================================
Resources:

  # -- Security Group ----------------------------------------------------------

  SgCloudApp:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentName}-sg-cloud-app"
      GroupDescription: "Cloud App Server - HTTP public, ICMP internal"
      VpcId:
        Fn::ImportValue: !Sub "${EnvironmentName}-VpcA-Id"
      SecurityGroupIngress:
        - Description: "HTTP from internet"
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
        - Description: "ICMP from internal"
          IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: "10.0.0.0/8"
      SecurityGroupEgress:
        - Description: "All outbound"
          IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-sg-cloud-app"

  # -- EC2-Cloud (10.1.0.40) ---------------------------------------------------

  CloudApp:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.micro
      ImageId: !Ref LatestAL2023AmiArm64
      SubnetId:
        Fn::ImportValue: !Sub "${EnvironmentName}-A-Public-1a-Id"
      PrivateIpAddress: "10.1.0.40"
      SecurityGroupIds:
        - !Ref SgCloudApp
      IamInstanceProfile: ec2-instance-role
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e
          exec > >(tee /var/log/userdata-ec2-cloud.log) 2>&1
          echo "[$(date)] Starting EC2-Cloud setup..."

          dnf update -y
          dnf install -y nodejs bind-utils nc postgresql18

          hostnamectl set-hostname app.cloud.viet.vn

          mkdir -p /opt/app

          # Write package.json with ES module type first, then install
          python3 -c "
          import json
          pkg = {
            'name': 'cloud-app',
            'version': '1.0.0',
            'type': 'module',
            'main': 'app.js',
            'scripts': { 'start': 'node app.js' },
            'dependencies': { 'pg': '^8.13.3' }
          }
          open('/opt/app/package.json','w').write(json.dumps(pkg, indent=2))
          "

          cd /opt/app
          npm install

          # Dummy app — copy cloud-app.js from repo, rename to app.js before demo
          python3 -c "
          open('/opt/app/app.js','w').write(
          'import http from \"http\";\n'
          'http.createServer((req, res) => {\n'
          '  res.writeHead(200, { \"Content-Type\": \"text/html\" });\n'
          '  res.end(\"<h1>app.cloud.viet.vn</h1><p>Copy cloud-app.js from repo and rename to app.js.</p>\");\n'
          '}).listen(80, () => console.log(\"Listening on port 80\"));\n'
          )
          "

          # Write systemd service
          python3 -c "
          open('/etc/systemd/system/demo-app.service','w').write(
          '[Unit]\n'
          'Description=Hybrid DNS Demo Cloud App Server\n'
          'After=network.target\n'
          '[Service]\n'
          'WorkingDirectory=/opt/app\n'
          'ExecStart=/usr/bin/node app.js\n'
          'Restart=always\n'
          'RestartSec=3\n'
          'User=root\n'
          '[Install]\n'
          'WantedBy=multi-user.target\n'
          )
          "

          # Write dns-test helper
          python3 -c "
          open('/usr/local/bin/dns-test','w').write(
          '#!/bin/bash\n'
          'echo \"============================================\"\n'
          'echo \" DNS Test: app.cloud.viet.vn (10.1.0.40)\"\n'
          'echo \"============================================\"\n'
          'echo \"\"\n'
          'echo \"-- Current DNS server --\"\n'
          'grep nameserver /etc/resolv.conf\n'
          'echo \"\"\n'
          'echo \"-- Cloud records (via configured DNS) --\"\n'
          'dig +noall +answer app.cloud.viet.vn\n'
          'dig +noall +answer db.cloud.viet.vn\n'
          'echo \"\"\n'
          'echo \"-- On-prem records (via configured DNS) --\"\n'
          'dig +noall +answer app.op.viet.vn\n'
          'dig +noall +answer db.op.viet.vn\n'
          'dig +noall +answer dns.op.viet.vn\n'
          'echo \"\"\n'
          'echo \"-- AWS service DNS --\"\n'
          'dig +noall +answer s3.ap-southeast-1.amazonaws.com\n'
          'echo \"\"\n'
          'echo \"-- Connectivity to OP App Server (direct IP) --\"\n'
          'curl -sf --connect-timeout 3 http://10.2.1.20/ || echo \"Not reachable via IP\"\n'
          )
          "
          chmod +x /usr/local/bin/dns-test

          # Write db-test helper
          python3 -c "
          open('/usr/local/bin/db-test','w').write(
          '#!/bin/bash\n'
          'echo \"Testing PostgreSQL to db.cloud.viet.vn:5432 ...\"\n'
          'PGPASSWORD=DemoPassword psql -h db.cloud.viet.vn -U dbadmin -d demo \\\n'
          '  -c \"SELECT * FROM products;\" \\\n'
          '  && echo \"SUCCESS\" \\\n'
          '  || echo \"FAILED - check DNS and security group\"\n'
          )
          "
          chmod +x /usr/local/bin/db-test

          systemctl daemon-reload
          systemctl enable demo-app
          systemctl start demo-app

          echo "[$(date)] EC2-Cloud setup complete."
      Tags:
        - Key: Name
          Value: "Cloud-App"

  # -- Cloud DB Server (10.1.0.50) ---------------------------------------------

  SgCloudDb:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentName}-sg-cloud-db"
      GroupDescription: "Cloud DB Server - PostgreSQL from Cloud App only"
      VpcId:
        Fn::ImportValue: !Sub "${EnvironmentName}-VpcA-Id"
      SecurityGroupIngress:
        - Description: "PostgreSQL from Cloud App Server"
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref SgCloudApp
        - Description: "ICMP from internal"
          IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: "10.0.0.0/8"
      SecurityGroupEgress:
        - Description: "All outbound"
          IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-sg-cloud-db"

  CloudDb:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t4g.micro
      ImageId: !Ref LatestAL2023AmiArm64
      SubnetId:
        Fn::ImportValue: !Sub "${EnvironmentName}-A-Public-1a-Id"
      PrivateIpAddress: "10.1.0.50"
      SecurityGroupIds:
        - !Ref SgCloudDb
      IamInstanceProfile: ec2-instance-role
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -e

          DB_NAME="demo"
          DB_USER="dbadmin"
          DB_PASSWORD="DemoPassword"
          TABLE_NAME="products"

          dnf update -y
          dnf install -y postgresql18-server bind-utils nc

          hostnamectl set-hostname db.cloud.viet.vn

          postgresql-setup --initdb
          systemctl enable postgresql
          systemctl start postgresql

          sudo -u postgres psql -c "CREATE USER ${DB_USER} WITH PASSWORD '${DB_PASSWORD}';"
          sudo -u postgres createdb -O ${DB_USER} ${DB_NAME}
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${DB_NAME} TO ${DB_USER};"

          sudo -u postgres psql -d ${DB_NAME} -c "
          CREATE TABLE ${TABLE_NAME} (
            id       SERIAL PRIMARY KEY,
            name     VARCHAR(255) NOT NULL,
            price    DECIMAL(10, 2),
            sku      VARCHAR(50)
          );"

          sudo -u postgres psql -d ${DB_NAME} -c "
          INSERT INTO ${TABLE_NAME} (name, price, sku) VALUES
            ('Mouse',    19.99,   'SKU001'),
            ('Laptop',   2999.99, 'SKU002'),
            ('Keyboard', 39.99,   'SKU003');"

          sudo -u postgres psql -d ${DB_NAME} -c "
            GRANT ALL ON SCHEMA public TO ${DB_USER};
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO ${DB_USER};
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO ${DB_USER};
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO ${DB_USER};
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON SEQUENCES TO ${DB_USER};
          "

          sed -i "s/^#*listen_addresses = 'localhost'/listen_addresses = '*'/g" /var/lib/pgsql/data/postgresql.conf
          sed -i 's/local   all             all                                     peer/local   all             all                                     scram-sha-256/g' /var/lib/pgsql/data/pg_hba.conf
          sed -i 's/host    all             all             127.0.0.1\/32            ident/host    all             all             127.0.0.1\/32            scram-sha-256/g' /var/lib/pgsql/data/pg_hba.conf
          sed -i 's/host    all             all             ::1\/128                 ident/host    all             all             ::1\/128                 scram-sha-256/g' /var/lib/pgsql/data/pg_hba.conf
          sed -i '$a host    demo    dbadmin    0.0.0.0/0    md5' /var/lib/pgsql/data/pg_hba.conf

          systemctl restart postgresql
      Tags:
        - Key: Name
          Value: "Cloud-DB"

# =============================================================================
Outputs:

  CloudAppInstanceId:
    Description: EC2-Cloud Instance ID
    Value: !Ref CloudApp
    Export:
      Name: !Sub "${EnvironmentName}-CloudApp-Id"

  CloudAppPublicIp:
    Description: EC2-Cloud Public IP
    Value: !GetAtt CloudApp.PublicIp

  CloudAppPrivateIp:
    Description: EC2-Cloud Private IP (10.1.0.40)
    Value: !GetAtt CloudApp.PrivateIp

  SgCloudAppId:
    Description: Cloud App Security Group ID
    Value: !Ref SgCloudApp
    Export:
      Name: !Sub "${EnvironmentName}-SgCloudApp-Id"

  CloudDbInstanceId:
    Description: Cloud DB Instance ID
    Value: !Ref CloudDb
    Export:
      Name: !Sub "${EnvironmentName}-CloudDb-Id"

  CloudDbPrivateIp:
    Description: Cloud DB Private IP (10.1.0.50)
    Value: !GetAtt CloudDb.PrivateIp

  SgCloudDbId:
    Description: Cloud DB Security Group ID
    Value: !Ref SgCloudDb
    Export:
      Name: !Sub "${EnvironmentName}-SgCloudDb-Id"
