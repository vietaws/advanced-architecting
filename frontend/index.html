<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Architecting Pro Demo - Containerization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AWS Containerization with Amazon EKS</h1>
            <span id="version-id" style="color:orange;font-size:14px;margin-left:auto;">hello@viet.vn</span>
            <nav>
                <button class="tab active" data-tab="home">🏠 Home</button>
                <button class="tab" data-tab="products">Products_DynamoDB</button>
                <button class="tab" data-tab="products-dax">Products_DAX</button>
                <button class="tab" data-tab="providers">Providers_RDS</button>
                <button class="tab" data-tab="orders">Orders_SQS</button>
            </nav>
        </header>

        <!-- ── Home: Service Status Dashboard ─────────────────────────────── -->
        <!-- Cards are built dynamically by buildDashboardCards() in app.js   -->
        <main id="home" class="tab-content active">
            <div class="dashboard-header">
                <h2>Infrastructure Status</h2>
                <button class="btn-primary" onclick="loadDashboard()">↻ Refresh</button>
            </div>
            <div id="dashboard-grid" class="dashboard-grid"></div>
        </main>

        <!-- ── Products (DynamoDB) ────────────────────────────────────────── -->
        <main id="products" class="tab-content">
            <div class="actions">
                <button class="btn-primary" onclick="showProductForm()">+ Add Product</button>
            </div>

            <div id="product-form" class="form-card hidden">
                <h3>Add Product</h3>
                <input type="text" id="product_name" placeholder="Product Name" required>
                <textarea id="description" placeholder="Description"></textarea>
                <input type="file" id="image_file" accept="image/*">
                <input type="number" id="price" placeholder="Price" step="0.01">
                <input type="number" id="remaining_sku" placeholder="Stock Quantity">
                <div class="form-actions">
                    <button class="btn-primary" onclick="createProduct()">Save</button>
                    <button class="btn-secondary" onclick="hideProductForm()">Cancel</button>
                </div>
            </div>

            <div id="products-list" class="grid"></div>
        </main>

        <!-- ── Products (DAX) ─────────────────────────────────────────────── -->
        <main id="products-dax" class="tab-content">
            <div id="products-dax-list" class="grid"></div>
        </main>

        <!-- ── Providers (RDS) ───────────────────────────────────────────── -->
        <main id="providers" class="tab-content">
            <div class="actions">
                <button class="btn-primary" onclick="showProviderForm()">+ Add Provider</button>
            </div>

            <div id="provider-form" class="form-card hidden">
                <h3>Add Provider</h3>
                <input type="text" id="provider_name" placeholder="Provider Name" required>
                <input type="text" id="provider_city" placeholder="City">
                <input type="file" id="provider_image" accept="image/*">
                <div class="form-actions">
                    <button class="btn-primary" onclick="createProvider()">Save</button>
                    <button class="btn-secondary" onclick="hideProviderForm()">Cancel</button>
                </div>
            </div>

            <div id="providers-list" class="grid"></div>
        </main>

        <!-- ── Orders (SQS + DynamoDB) ───────────────────────────────────── -->
        <main id="orders" class="tab-content">
            <div class="actions">
                <button class="btn-primary" onclick="generateOrders()">📦 Generate 10 Orders to SQS</button>
                <button class="btn-primary" onclick="getOrderStatus()" style="margin-left:10px;">📋 Get Order Status</button>
                <span id="order-status" style="margin-left:15px;color:#666;"></span>
            </div>
            <div style="margin-top:20px;padding:20px;background:#f5f5f5;border-radius:8px;">
                <h3>Order Management</h3>
                <p>Generate 10 sample orders to SQS or view order status from DynamoDB.</p>
                <p style="color:#666;font-size:14px;">Each order includes: ID, Product Name, Quantity, Price, Customer ID, Status, and Timestamp.</p>
            </div>
            <div id="orders-list" style="margin-top:20px;"></div>
        </main>

    </div>

    <!-- config.js MUST be loaded before app.js — it sets window.APP_CONFIG.API_URL -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
