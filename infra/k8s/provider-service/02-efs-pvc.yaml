# NOTE: Replace EFS_FILE_SYSTEM_ID with your actual EFS filesystem ID
# (e.g., fs-0123456789abcdef0). Find it with:
#   aws efs describe-file-systems --region ap-southeast-1 --query 'FileSystems[*].[FileSystemId,Name]'
#
# Also ensure the EFS CSI Driver is installed on the cluster:
#   kubectl apply -k "github.com/kubernetes-sigs/aws-efs-csi-driver/deploy/kubernetes/overlays/stable/?ref=release-1.7"

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: Immediate

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    # Replace EFS_FILE_SYSTEM_ID with your actual EFS filesystem ID
    volumeHandle: EFS_FILE_SYSTEM_ID

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: efs-claim
  namespace: app
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 5Gi
  volumeName: efs-pv
